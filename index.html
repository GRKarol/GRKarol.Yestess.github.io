function fmtDuration(ms){
  if(!ms || ms<1000) return '0s';
  const s=Math.floor(ms/1000), m=Math.floor(s/60), h=Math.floor(m/60);
  if(h>0) return h+'h '+(m%60)+'m';
  if(m>0) return m+'m '+(s%60)+'s';
  return s+'s';
}

function duplicateProject(id){
  closeSheet();
  const p=state.db.projects.find(x=>x.id===id); if(!p) return;
  const clone=JSON.parse(JSON.stringify(p));
  clone.id=uid('p');
  clone.name=p.name+' (copy)';
  // regenerate all ids
  const idMap={};
  clone.sections.forEach(s=>{ const newId=uid('s'); idMap[s.id]=newId; s.id=newId; });
  clone.notes.forEach(n=>{
    n.id=uid('n');
    if(n.sectionId && idMap[n.sectionId]) n.sectionId=idMap[n.sectionId];
    n.blocks.forEach(b=>b.id=uid('b'));
  });
  if(clone.customBlockKinds) clone.customBlockKinds.forEach(k=>k.id=uid('ck'));
  clone.createdAt=Date.now(); clone.updatedAt=Date.now();
  state.db.projects.push(clone);
  saveDb();
  toast(t('toast.copied'));
  renderCurrentView();
}

function copyProjectText(id){
  closeSheet();
  const p=state.db.projects.find(x=>x.id===id); if(!p) return;
  let text=`# ${p.name}\n\n${p.desc?p.desc+'\n\n':''}`;
  const sorted=[...p.sections].sort((a,b)=>a.order-b.order);
  sorted.forEach(sec=>{
    text += `## ${sec.name}\n\n`;
    const notes=p.notes.filter(n=>n.sectionId===sec.id).sort((a,b)=>{
      if(!!b.pinned !== !!a.pinned) return (b.pinned?1:0)-(a.pinned?1:0);
      return (b.updatedAt||0)-(a.updatedAt||0);
    });
    notes.forEach(n=>{
      if(n.title) text+=`### ${n.title}\n\n`;
      n.blocks.forEach(b=>{
        if(b.kind==='image'||b.kind==='audio'||b.kind==='drawing') text+=`[${b.kind}]\n\n`;
        else text+=plainText(b.content||'')+'\n\n';
      });
      text+='\n---\n\n';
    });
  });
  doCopy(text);
}
function copyNoteText(){
  closeSheet();
  const n=getNote(); if(!n) return;
  let text='';
  if(n.title)text+=`# ${n.title}\n\n`;
  n.blocks.forEach(b=>{
    if(b.kind==='image'||b.kind==='audio'||b.kind==='drawing') text+=`[${b.kind}]\n\n`;
    else text+=plainText(b.content||'')+'\n\n';
  });
  doCopy(text);
}
function doCopy(text){
  if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast(t('toast.copied'))).catch(()=>legacyCopy(text)); }
  else legacyCopy(text);
}
function legacyCopy(text){
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');toast(t('toast.copied'));}catch(e){}
  ta.remove();
}

/* ═══ EDITOR + BLOCKS ═══ */
function renderEditor(){
  const note=getNote();
  if(!note){ headerLeftAction(); return; }

  const titleEl=document.getElementById('edTitle');
  titleEl.value=note.title||'';
  titleEl.oninput=()=>{ note.title=titleEl.value; note.updatedAt=Date.now(); saveDb(); };

  const c=document.getElementById('blocksContainer');
  c.innerHTML='';
  note.blocks.forEach((b,idx)=>c.appendChild(makeBlock(b,idx,note)));

  // Build add-block bar: ordered by cfg.blockOrder (user-customizable in Settings)
  const bar=document.getElementById('addBlockBar');
  bar.innerHTML='';
  const allKinds = {
    text:      {label:t('block.text'),     icon:SVG.pen},
    heading:   {label:t('block.heading'),  icon:SVG.pen},
    check:     {label:t('block.check'),    icon:SVG.check},
    quote:     {label:t('block.quote'),    icon:SVG.quote},
    callout:   {label:t('block.callout'),  icon:SVG.star},
    code:      {label:t('block.code'),     icon:SVG.code},
    markdown:  {label:t('block.markdown'), icon:SVG.pen},
    dictation: {label:t('block.dictation'),icon:SVG.mic},
    image:     {label:t('block.image'),    icon:SVG.image},
    audio:     {label:t('block.audio'),    icon:SVG.mic},
    drawing:   {label:t('block.drawing'),  icon:SVG.pen}
  };
  const order = (state.cfg && state.cfg.blockOrder) || ['text','heading','check','quote','callout','code','markdown','image','audio','drawing','dictation'];
  const shortCount = 6;
  const shortList = order.slice(0, shortCount);
  const moreList  = order.slice(shortCount);
  shortList.forEach(k=>{
    const def=allKinds[k]; if(!def) return;
    const btn=document.createElement('button'); btn.className='add-block-btn'; btn.innerHTML=`${def.icon}<span>${esc(def.label)}</span>`;
    btn.onclick=()=>addBlock(k, note, null);
    bar.appendChild(btn);
  });

  // Custom block kinds for this project
  const p=getProject();
  if (p && p.customBlockKinds && p.customBlockKinds.length){
    p.customBlockKinds.forEach(ck=>{
      const btn=document.createElement('button'); btn.className='add-block-btn custom';
      btn.innerHTML=`<span class="block-kind-dot" style="background:${ck.color}"></span><span>${esc(ck.name)}</span>`;
      btn.onclick=()=>addBlock('text', note, ck.id);
      bar.appendChild(btn);
    });
  }

  // More button
  if(moreList.length){
    const moreBtn=document.createElement('button'); moreBtn.className='add-block-btn more';
    moreBtn.innerHTML=`<span>${esc(t('block.more'))}</span>`;
    moreBtn.onclick=()=>{
      const rest = moreList.map(k=>({kind:k, ...allKinds[k]})).filter(x=>x.label);
      openSheet(t('block.more'), '<div class="stack">'+rest.map((k,i)=>`<button class="action-row" data-mk="${i}">${k.icon||''}<span class="action-row-label">${esc(k.label)}</span></button>`).join('')+'</div>');
      setTimeout(()=>{
        document.querySelectorAll('.sheet-body [data-mk]').forEach(b=>{
          b.onclick=()=>{ const k=rest[Number(b.dataset.mk)]; closeSheet(); addBlock(k.kind, note, null); };
        });
      }, 100);
    };
    bar.appendChild(moreBtn);
  }
}

function addBlock(kind, note, customKindId){
  const b={id:uid('b'), kind, content:''};
  if (customKindId) b.customKindId = customKindId;
  note.blocks.push(b);
  note.updatedAt=Date.now();
  saveDb();
  renderEditor();
  if(kind==='image') triggerImagePick(b.id);
  else if(kind==='drawing') openDraw(b.id);
  else {
    setTimeout(()=>{
      const blocks=document.querySelectorAll('#blocksContainer .block-content');
      const last=blocks[blocks.length-1];
      if(last) last.focus();
    }, 50);
  }
}

        <button class="block-act-btn" data-act="del"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>

  } else if(block.kind==='dictation'){

  } else {

/* Touch-friendly drag-drop for blocks */
function attachBlockDrag(wrap, block, note){
  const handle = wrap.querySelector('[data-drag]');
  if(!handle) return;
  let startY=0, dragging=false, ghost=null, targetIdx=-1;
  const onDown = (e)=>{
    const pt = e.touches?e.touches[0]:e;
    startY=pt.clientY; dragging=true;
    wrap.classList.add('dragging');
    ghost = wrap.cloneNode(true);
    ghost.style.position='fixed'; ghost.style.left=wrap.getBoundingClientRect().left+'px';
    ghost.style.top=wrap.getBoundingClientRect().top+'px';
    ghost.style.width=wrap.offsetWidth+'px'; ghost.style.pointerEvents='none';
    ghost.style.opacity='0.7'; ghost.style.zIndex='200';
    ghost.style.boxShadow='var(--shadow-l)';
    document.body.appendChild(ghost);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove, {passive:false});
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchend', onUp);
    if(e.preventDefault) e.preventDefault();
  };
  const onMove = (e)=>{
    if(!dragging) return;
    const pt = e.touches?e.touches[0]:e;
    ghost.style.top = (pt.clientY - wrap.offsetHeight/2) + 'px';
    // Find target block under pointer
    const cont = document.getElementById('blocksContainer'); if(!cont) return;
    const all = [...cont.querySelectorAll('.block')];
    all.forEach(b=>b.classList.remove('drag-over'));
    let best=null, bestDist=Infinity, bestIdx=-1;
    all.forEach((b,i)=>{
      if(b===wrap) return;
      const r=b.getBoundingClientRect(); const mid=r.top+r.height/2;
      const d=Math.abs(pt.clientY-mid);
      if(d<bestDist){ bestDist=d; best=b; bestIdx=i; }
    });
    if(best){ best.classList.add('drag-over'); targetIdx=bestIdx; }
    if(e.preventDefault) try{e.preventDefault();}catch(_){}
  };
  const onUp = ()=>{
    if(!dragging) return;
    dragging=false; wrap.classList.remove('dragging');
    document.querySelectorAll('.block.drag-over').forEach(b=>b.classList.remove('drag-over'));
    if(ghost){ ghost.remove(); ghost=null; }
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchend', onUp);
    if(targetIdx>=0 && targetIdx!==note.blocks.indexOf(block)){
      const fromIdx=note.blocks.indexOf(block);
      const [moved]=note.blocks.splice(fromIdx,1);
      note.blocks.splice(targetIdx,0,moved);
      note.updatedAt=Date.now(); saveDb(); renderEditor();
    }
    targetIdx=-1;
  };
  handle.addEventListener('mousedown', onDown);
  handle.addEventListener('touchstart', onDown, {passive:false});
}

function renderCheckBlock(raw){
  if(!raw) return '<div class="todo-line"><input type="checkbox"><span contenteditable="true"></span></div>';
  if(/^</.test(raw.trim())) return raw;
  return raw.split('\n').map(line=>{
    const done=/^\[x\]/i.test(line.trim());
    const txt=line.replace(/^\[[x ]\]\s*/i,'');
    return `<div class="todo-line${done?' done':''}"><input type="checkbox"${done?' checked':''}><span contenteditable="true">${esc(txt)}</span></div>`;
  }).join('');
}

/* ═══ MARKDOWN BLOCK ═══ */
function mdToHtml(src){
  if(!src) return '';
  let s = esc(src);
  // Code blocks
  s = s.replace(/```([\w-]*)\n([\s\S]*?)```/g, (m,lang,code)=>`<pre><code class="lang-${esc(lang)}">${code}</code></pre>`);
  // Inline code
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  // Headings
  s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  s = s.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  s = s.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Bold / italic
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/_([^_]+)_/g, '<em>$1</em>');
  // Links
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // Blockquotes
  s = s.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // Lists
  s = s.replace(/((?:^[-*] .+(?:\n|$))+)/gm, m => '<ul>'+m.trim().split('\n').map(l=>'<li>'+l.replace(/^[-*] /,'')+'</li>').join('')+'</ul>');
  s = s.replace(/((?:^\d+\. .+(?:\n|$))+)/gm, m => '<ol>'+m.trim().split('\n').map(l=>'<li>'+l.replace(/^\d+\. /,'')+'</li>').join('')+'</ol>');
  // HR
  s = s.replace(/^---$/gm, '<hr>');
  // Paragraphs (simple)
  s = s.split(/\n{2,}/).map(p=>{
    const tr=p.trim();
    if(!tr) return '';
    if(/^<(h\d|ul|ol|pre|blockquote|hr|p)/i.test(tr)) return tr;
    return '<p>'+tr.replace(/\n/g,'<br>')+'</p>';
  }).join('');
  return s;
}
function renderMarkdownBlock(block, note){
  const wrap=document.createElement('div');
  wrap.className='md-block';
  const ta=document.createElement('textarea');
  ta.placeholder=t('ph.markdown');
  ta.value=block.content||'';
  const preview=document.createElement('div');
  preview.className='md-preview';
  const toggle=document.createElement('button');
  toggle.className='md-toggle';
  toggle.textContent=t('block.markdown.preview');
  let showing='edit';
  const updatePreview = ()=>{ preview.innerHTML = mdToHtml(ta.value); };
  const refresh = ()=>{
    if(showing==='edit'){ ta.style.display='block'; preview.style.display='none'; toggle.textContent=t('block.markdown.preview'); }
    else { updatePreview(); ta.style.display='none'; preview.style.display='block'; toggle.textContent=t('block.markdown.edit'); }
  };
  toggle.onclick=()=>{ showing = showing==='edit'?'preview':'edit'; refresh(); };
  ta.addEventListener('input', ()=>{
    block.content=ta.value; note.updatedAt=Date.now(); saveDb();
  });
  ta.addEventListener('focus', ()=>showFmtBarMeta());
  ta.addEventListener('blur',  ()=>setTimeout(()=>{ if(!document.activeElement?.closest?.('.md-block')) hideFmtBar(); }, 200));
  wrap.appendChild(toggle);
  wrap.appendChild(ta);
  wrap.appendChild(preview);
  refresh();
  return wrap;
}

/* ═══ CODE BLOCK with run (sandboxed iframe for HTML/JS) ═══ */
function renderCodeBlock(block, note){
  const wrap=document.createElement('div');
  wrap.className='code-block-wrap';
  wrap.dataset.lang = (block.content && block.content.__lang) || '';
  const parsed = parseCodeContent(block.content||'');
  const bar=document.createElement('div');
  bar.className='code-block-bar';
  bar.innerHTML=`
    <select class="code-block-lang">
      <option value="html">HTML</option>
      <option value="js">JavaScript</option>
      <option value="css">CSS</option>
      <option value="cpp">C++</option>
      <option value="python">Python</option>
      <option value="java">Java</option>
      <option value="other">Inny</option>
    </select>
    <button class="code-block-run" data-run title="Uruchom">▶ ${esc(t('block.code.run'))}</button>
  `;
  const sel=bar.querySelector('.code-block-lang');
  sel.value = parsed.lang || 'html';
  const ta=document.createElement('textarea');
  ta.className='code-block-content';
  ta.value = parsed.code || '';
  ta.placeholder=t('ph.code');
  const output=document.createElement('div');
  output.className='code-block-output';
  const commit = ()=>{
    block.content = JSON.stringify({__codeBlock:1, lang:sel.value, code:ta.value});
    note.updatedAt=Date.now(); saveDb();
  };
  ta.addEventListener('input', commit);
  sel.addEventListener('change', ()=>{
    commit();
    updateRunBtn();
  });
  const runBtn = bar.querySelector('[data-run]');
  const updateRunBtn=()=>{
    const runnable = ['html','js','css'].includes(sel.value);
    runBtn.disabled = !runnable;
    runBtn.title = runnable ? 'Uruchom' : 'Tylko HTML / JS / CSS uruchamia się w przeglądarce';
  };
  runBtn.onclick = ()=>{
    const lang=sel.value, code=ta.value;
    output.innerHTML='';
    if(lang==='html'){
      const iframe=document.createElement('iframe');
      iframe.setAttribute('sandbox','allow-scripts');
      iframe.srcdoc = code;
      output.appendChild(iframe);
      const h = Math.min(280, Math.max(120, code.split('\n').length * 22));
      iframe.style.height = h+'px';
    } else if(lang==='js'){
      const wrapped = `<!DOCTYPE html><html><head><style>body{font-family:system-ui,sans-serif;padding:10px;margin:0;font-size:13px}pre{white-space:pre-wrap;word-break:break-all;margin:0}</style></head><body><pre id="o"></pre><script>
        const _o=document.getElementById('o');
        const _log=(...a)=>{ _o.textContent += a.map(x=>typeof x==='object'?JSON.stringify(x,null,2):String(x)).join(' ')+'\\n'; };
        const console={log:_log, warn:_log, error:_log, info:_log};
        try { ${code} } catch(e){ _o.style.color='#b83232'; _o.textContent += 'Error: '+e.message; }
      </`+`script></body></html>`;
      const iframe=document.createElement('iframe');
      iframe.setAttribute('sandbox','allow-scripts');
      iframe.srcdoc = wrapped;
      iframe.style.height='200px';
      output.appendChild(iframe);
    } else if(lang==='css'){
      const html = `<!DOCTYPE html><html><head><style>${code}</style></head><body><h1>Nagłówek 1</h1><h2>Nagłówek 2</h2><p>Przykładowy paragraf <a href="#">link</a>.</p><button>Przycisk</button><ul><li>Lista</li><li>Druga</li></ul></body></html>`;
      const iframe=document.createElement('iframe');
      iframe.setAttribute('sandbox','allow-scripts');
      iframe.srcdoc = html;
      iframe.style.height='240px';
      output.appendChild(iframe);
    } else {
      const pre=document.createElement('pre');
      pre.textContent = t('block.code.notRunnable');
      output.appendChild(pre);
    }
  };
  updateRunBtn();
  wrap.appendChild(bar);
  wrap.appendChild(ta);
  wrap.appendChild(output);
  return wrap;
}
function parseCodeContent(raw){
  if(!raw) return {lang:'html', code:''};
  try{
    const obj=JSON.parse(raw);
    if(obj && obj.__codeBlock) return {lang:obj.lang||'html', code:obj.code||''};
  }catch(e){}
  return {lang:'html', code:raw}; // backward compat: old code blocks stored as plain text
}

/* ═══ DICTATION BLOCK — dedicated block for voice notes ═══ */
function renderDictationBlock(block, note){
  const wrap=document.createElement('div');
  wrap.className='dictation-block';
  const ce=document.createElement('div');
  ce.className='block-content';
  ce.setAttribute('contenteditable','true');
  ce.setAttribute('data-placeholder', t('ph.dictation'));
  ce.innerHTML = block.content || '';
  attachContentEditable(ce, block, note);
  const btn=document.createElement('button');
  btn.className='btn btn-ghost';
  btn.style.width='100%';
  btn.style.marginTop='6px';
  btn.innerHTML = `${SVG.mic}<span>${esc(t('block.dictation.start'))}</span>`;
  let rec=null;
  btn.onclick=()=>{
    if(rec){
      try{ rec.stop(); }catch(e){}
      rec=null;
      btn.innerHTML = `${SVG.mic}<span>${esc(t('block.dictation.start'))}</span>`;
      return;
    }
    const sr=getSR(); if(!sr){ toast(t('toast.voiceErr')); return; }
    sr.lang = state.cfg.lang==='en' ? 'en-US' : 'pl-PL';
    sr.continuous=true; sr.interimResults=true;
    let finalText = block.content ? plainText(block.content) : '';
    sr.onresult = (e)=>{
      let interim=''; let finalBatch='';
      for(let i=e.resultIndex; i<e.results.length; i++){
        const tr = e.results[i][0].transcript;
        if(e.results[i].isFinal) finalBatch += tr+' '; else interim += tr;
      }
      if(finalBatch){ finalText = (finalText?finalText+' ':'') + finalBatch; }
      ce.innerHTML = esc(finalText) + (interim?`<span style="opacity:0.5">${esc(interim)}</span>`:'');
      block.content = ce.innerHTML; note.updatedAt=Date.now(); saveDb();
    };
    sr.onerror=()=>toast(t('toast.voiceErr'));
    sr.onend=()=>{
      rec=null;
      btn.innerHTML = `${SVG.mic}<span>${esc(t('block.dictation.start'))}</span>`;
    };
    try{ sr.start(); rec=sr; btn.innerHTML = `${SVG.mic}<span>${esc(t('block.dictation.stop'))}</span>`; toast(t('toast.voiceStart')); }
    catch(e){ toast(t('toast.voiceErr')); }
  };
  wrap.appendChild(ce);
  wrap.appendChild(btn);
  return wrap;
}
function serializeCheckBlock(container){
  const lines=[];
  container.querySelectorAll('.todo-line').forEach(line=>{
    const done=line.querySelector('input[type=checkbox]')?.checked;
    const txt=line.querySelector('span')?.textContent||'';
    lines.push((done?'[x] ':'[ ] ')+txt);
  });
  return lines.join('\n');
}
function attachCheckHandlers(ce, block, note){
  ce.addEventListener('change', e=>{
    if(e.target.matches('input[type=checkbox]')){
      const line=e.target.closest('.todo-line');
      if(line) line.classList.toggle('done', e.target.checked);
      block.content=serializeCheckBlock(ce);
      note.updatedAt=Date.now(); saveDb();
    }
  });
  ce.addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.matches('span[contenteditable]')){
      e.preventDefault();
      const line=e.target.closest('.todo-line');
      const nl=document.createElement('div');
      nl.className='todo-line';
      nl.innerHTML='<input type="checkbox"><span contenteditable="true"></span>';
      line.after(nl);
      nl.querySelector('span').focus();
      block.content=serializeCheckBlock(ce);
      note.updatedAt=Date.now(); saveDb();
    }
    if(e.key==='Backspace' && e.target.matches('span[contenteditable]') && e.target.textContent===''){
      const line=e.target.closest('.todo-line');
      const prev=line.previousElementSibling;
      if(prev){
        e.preventDefault();
        line.remove();
        const prevSpan=prev.querySelector('span');
        prevSpan.focus();
        const range=document.createRange(), sel=window.getSelection();
        range.selectNodeContents(prevSpan); range.collapse(false);
        sel.removeAllRanges(); sel.addRange(range);
        block.content=serializeCheckBlock(ce);
        note.updatedAt=Date.now(); saveDb();
      }
    }
  });
}
function attachContentEditable(ce, block, note){
  ce.addEventListener('input', ()=>{
    if(block.kind==='check') block.content=serializeCheckBlock(ce);
    else block.content=ce.innerHTML;
    note.updatedAt=Date.now(); saveDb();
  });
  ce.addEventListener('focus', ()=>{ ce.closest('.block').classList.add('focused'); showFmtBar(ce); });
  ce.addEventListener('blur', ()=>{
    ce.closest('.block').classList.remove('focused');
    setTimeout(()=>{ if(!document.activeElement?.closest?.('.block-content')) hideFmtBar(); }, 200);
  });
}

/* ═══ FORMATTING BAR ═══ */
let activeCE=null;
let savedRange=null;
function showFmtBar(ce){
  activeCE=ce;
  const bar=document.getElementById('fmtBar');
  const kind=ce.closest('.block')?.dataset.kind;
  if(kind==='code'||kind==='check'||kind==='markdown'){ bar.classList.remove('show'); return; }
  bar.classList.add('show');
}
function hideFmtBar(){ document.getElementById('fmtBar').classList.remove('show'); activeCE=null; savedRange=null; }

function saveSelection(){
  try{
    const sel = window.getSelection();
    if(sel && sel.rangeCount>0 && activeCE && activeCE.contains(sel.anchorNode)){
      savedRange = sel.getRangeAt(0).cloneRange();
    }
  }catch(e){}
}
function restoreSelection(){
  if(!savedRange || !activeCE) return;
  try{
    activeCE.focus();
    const sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }catch(e){}
}

// Save selection continuously while editing
document.addEventListener('selectionchange', ()=>{ if(activeCE) saveSelection(); });

// Prevent default on fmt-btn press so caret stays in contenteditable
document.addEventListener('pointerdown', e=>{
  const btn=e.target.closest('.fmt-btn');
  if(!btn) return;
  saveSelection();
  e.preventDefault();
});
document.addEventListener('mousedown', e=>{
  if(e.target.closest('.fmt-btn')){ saveSelection(); e.preventDefault(); }
});
document.addEventListener('touchstart', e=>{
  if(e.target.closest('.fmt-btn')){ saveSelection(); e.preventDefault(); }
}, {passive:false});
document.addEventListener('click', e=>{
  const btn=e.target.closest('.fmt-btn');
  if(!btn||!activeCE) return;
  const cmd=btn.dataset.cmd;
  if(cmd==='dismiss'){ activeCE.blur(); hideFmtBar(); return; }
  if(cmd==='voice'){ restoreSelection(); startDictationInline(activeCE); return; }
  if(cmd==='find'){ openFind(); return; }
  restoreSelection();
  try{ document.execCommand(cmd,false,null); }catch(e){}
  saveSelection();
});

/* ═══ IMAGE PICK ═══ */
let imageTargetBlockId=null;
function triggerImagePick(blockId){
  imageTargetBlockId=blockId;
  const inp=document.getElementById('imgInput');
  inp.value='';
  inp.onchange=handleImagePicked;
  inp.click();
}
function handleImagePicked(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    const note=getNote();
    const block=note.blocks.find(b=>b.id===imageTargetBlockId);
    if(block){
      const img=new Image();
      img.onload=()=>{
        const max=1400, scale=Math.min(1,max/Math.max(img.width,img.height));
        const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        block.content=cv.toDataURL('image/jpeg',0.82);
        note.updatedAt=Date.now(); saveDb();
        renderEditor();
      };
      img.src=r.result;
    }
  };
  r.readAsDataURL(file);
}

/* ═══ AUDIO BLOCK (full UI) ═══ */
function renderAudioBlock(block, note){
  const wrap=document.createElement('div');
  wrap.className='audio-ui';
  if (block.content){
    // has recording
    wrap.innerHTML = `
      <div class="audio-row"><audio class="block-audio" controls src="${block.content}"></audio></div>
      <div class="audio-row">
        <button class="btn btn-ghost" data-recagain style="flex:1;min-height:36px;padding:8px 12px;font-size:13px">${SVG.mic}<span>${state.cfg.lang==='pl'?'Nagraj ponownie':'Record again'}</span></button>
        <button class="btn btn-ghost" data-delete style="min-height:36px;padding:8px 12px;font-size:13px;color:var(--red)">${SVG.trash}</button>
      </div>`;
    wrap.querySelector('[data-recagain]').onclick = ()=>{ block.content=''; note.updatedAt=Date.now(); saveDb(); renderEditor(); setTimeout(()=>startAudioRecording(block.id), 100); };
    wrap.querySelector('[data-delete]').onclick = ()=>{ if(confirm(t('confirm.delBlock'))){ block.content=''; note.updatedAt=Date.now(); saveDb(); renderEditor(); } };
  } else if (state.audioRec && state.audioTargetBlockId===block.id){
    // currently recording
    wrap.innerHTML = `
      <div class="audio-row">
        <div class="audio-timer rec" id="audioTimer_${block.id}">00:00</div>
        <button class="audio-rec-btn stop" data-stop style="flex:1">${SVG.mic}<span>${state.cfg.lang==='pl'?'Zatrzymaj':'Stop'}</span></button>
      </div>`;
    wrap.querySelector('[data-stop]').onclick = ()=>stopAudioRecording();
  } else {
    // not recording, no content
    wrap.innerHTML = `
      <div class="audio-row">
        <button class="audio-rec-btn" data-startrec style="flex:1">${SVG.mic}<span>${state.cfg.lang==='pl'?'Nagraj':'Record'}</span></button>
        <button class="btn btn-ghost" data-dictate style="flex:1;min-height:40px;padding:8px 12px">${SVG.mic}<span>${state.cfg.lang==='pl'?'Dyktuj':'Dictate'}</span></button>
      </div>`;
    wrap.querySelector('[data-startrec]').onclick = ()=>startAudioRecording(block.id);
    wrap.querySelector('[data-dictate]').onclick = ()=>startDictation(block.id);
  }
  return wrap;
}

async function startAudioRecording(blockId){
  // stop any existing recording first
  if (state.audioRec && state.audioRec.state!=='inactive'){
    try{ state.audioRec.stop(); }catch(e){}
  }
  state.audioTargetBlockId=blockId;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    state.audioRec=new MediaRecorder(stream);
    state.audioChunks=[];
    state.audioStart=Date.now();
    state.audioRec.ondataavailable=e=>{ if(e.data.size) state.audioChunks.push(e.data); };
    state.audioRec.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      clearInterval(state.audioTimer); state.audioTimer=null;
      const blob=new Blob(state.audioChunks,{type:'audio/webm'});
      const reader=new FileReader();
      reader.onload=()=>{
        const note=getNote();
        const b=note?.blocks?.find(x=>x.id===state.audioTargetBlockId);
        if(b){ b.content=reader.result; note.updatedAt=Date.now(); saveDb(); }
        state.audioRec=null; state.audioTargetBlockId=null;
        renderEditor();
      };
      reader.readAsDataURL(blob);
    };
    state.audioRec.start();
    renderEditor();
    // start timer
    state.audioTimer = setInterval(()=>{
      const el = document.getElementById('audioTimer_'+blockId);
      if(!el){ clearInterval(state.audioTimer); state.audioTimer=null; return; }
      const s = Math.floor((Date.now()-state.audioStart)/1000);
      el.textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
    }, 500);
  } catch(e){
    toast(t('toast.audioErr'));
    state.audioRec=null; state.audioTargetBlockId=null;
  }
}
function stopAudioRecording(){
  if(state.audioRec && state.audioRec.state!=='inactive'){
    try{ state.audioRec.stop(); }catch(e){}
  }
}

function getSR(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  return SR ? new SR() : null;
}
function startDictation(blockId){
  const sr=getSR(); if(!sr){ toast(t('toast.voiceErr')); return; }
  sr.lang = state.cfg.lang==='en' ? 'en-US' : 'pl-PL';
  sr.continuous=true; sr.interimResults=true;
  toast(t('toast.voiceStart'));
  let finalText='';
  const block = document.querySelector(`.block[data-id="${blockId}"]`);
  const statusEl = document.createElement('div');
  statusEl.className='voice-status';
  statusEl.innerHTML=`<span class="voice-dot"></span><span>${t('toast.voiceStart')}</span> <button class="btn" style="min-height:28px;padding:3px 10px;font-size:11px;background:var(--accent);color:var(--accent-text);margin-left:auto;">Stop</button>`;
  statusEl.querySelector('button').onclick=()=>stopDictation();
  if(block) block.appendChild(statusEl);
  sr.onresult=e=>{
    finalText='';
    for(let i=0;i<e.results.length;i++) finalText += e.results[i][0].transcript + ' ';
    const note=getNote();
    const b=note?.blocks?.find(x=>x.id===blockId);
    if(b){ b.content=finalText.trim(); note.updatedAt=Date.now(); saveDb(); }
  };
  sr.onerror=()=>toast(t('toast.voiceErr'));

    const b=getNote()?.blocks?.find(x=>x.id===blockId);

  };

  try{ sr.start(); }catch(e){ toast(t('toast.voiceErr')); }
}

/* ═══ FIND / REPLACE ═══ */
let findCtx = {q:'', idx:-1, matches:[]};
function openFind(){
  const bar=document.getElementById('findBar');
  bar.classList.add('open');
  const inp=document.getElementById('findInput');
  inp.value=''; document.getElementById('replaceInput').value='';
  findCtx={q:'', idx:-1, matches:[]};
  updateFindCount();
  setTimeout(()=>inp.focus(), 50);
}
function closeFind(){
  document.getElementById('findBar').classList.remove('open');
  clearFindHighlights();
  findCtx={q:'', idx:-1, matches:[]};
}
function clearFindHighlights(){
  const note=getNote(); if(!note) return;
  // Re-render to clear highlight marks
  document.querySelectorAll('mark.find-hit').forEach(m=>{
    const txt=document.createTextNode(m.textContent);
    m.replaceWith(txt);
  });
}
function doFindRun(q){
  clearFindHighlights();
  findCtx.q=q; findCtx.matches=[]; findCtx.idx=-1;
  if(!q){ updateFindCount(); return; }
  const note=getNote(); if(!note){ updateFindCount(); return; }
  const scope = document.querySelectorAll('#blocksContainer .block-content, #blocksContainer textarea, #edTitle');
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  scope.forEach(el=>{
    if(el.tagName==='TEXTAREA' || el.tagName==='INPUT'){
      // highlight count only — textarea can't hold <mark>
      const m = el.value.match(re);
      if(m) findCtx.matches.push(...m.map(()=>({el, type:'field'})));
    } else {
      // walk text nodes
      const walker=document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
      const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
      nodes.forEach(tn=>{
        if(!tn.nodeValue) return;
        const parts = tn.nodeValue.split(re);
        const hits  = tn.nodeValue.match(re);
        if(!hits) return;
        const frag=document.createDocumentFragment();
        parts.forEach((part,i)=>{
          frag.appendChild(document.createTextNode(part));
          if(i<parts.length-1){
            const mk=document.createElement('mark'); mk.className='find-hit'; mk.textContent=hits[i];
            frag.appendChild(mk);
            findCtx.matches.push({el:mk, type:'mark'});
          }
        });
        tn.replaceWith(frag);
      });
    }
  });
  if(findCtx.matches.length){ findCtx.idx=0; markCurrent(); }
  updateFindCount();
}
function markCurrent(){
  findCtx.matches.forEach((m,i)=>{ if(m.type==='mark') m.el.classList.toggle('cur', i===findCtx.idx); });
  const cur = findCtx.matches[findCtx.idx];
  if(cur && cur.el && cur.el.scrollIntoView){ try{ cur.el.scrollIntoView({block:'center', behavior:'smooth'}); }catch(e){} }
}
function updateFindCount(){
  document.getElementById('findCount').textContent = `${findCtx.matches.length?findCtx.idx+1:0}/${findCtx.matches.length}`;
}
function nextFind(dir){
  if(!findCtx.matches.length) return;
  findCtx.idx = (findCtx.idx + dir + findCtx.matches.length) % findCtx.matches.length;
  markCurrent(); updateFindCount();
}
function replaceOneFind(){
  const cur = findCtx.matches[findCtx.idx];
  if(!cur) return;
  const rep = document.getElementById('replaceInput').value;
  if(cur.type==='mark'){
    cur.el.replaceWith(document.createTextNode(rep));
    commitFindChangesToDb();
  } else if(cur.type==='field'){
    cur.el.value = cur.el.value.replace(new RegExp(findCtx.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'), rep);
    cur.el.dispatchEvent(new Event('input', {bubbles:true}));
  }
  doFindRun(findCtx.q);
}
function replaceAllFind(){
  if(!findCtx.q) return;
  const rep = document.getElementById('replaceInput').value;
  const re = new RegExp(findCtx.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  const note = getNote(); if(!note) return;
  note.blocks.forEach(b=>{ if(typeof b.content==='string') b.content=b.content.replace(re, rep); });
  note.title = (note.title||'').replace(re, rep);
  note.updatedAt = Date.now(); saveDb();
  renderEditor();
  setTimeout(()=>doFindRun(findCtx.q), 60);
  toast(t('toast.saved'));
}
function commitFindChangesToDb(){
  const note=getNote(); if(!note) return;
  // Re-read current content from DOM into blocks
  const blocks = document.querySelectorAll('#blocksContainer .block');
  blocks.forEach(bl=>{
    const id=bl.dataset.id; const b=note.blocks.find(x=>x.id===id); if(!b) return;
    const ce = bl.querySelector('.block-content');
    if(ce) b.content = ce.innerHTML;
  });
  note.updatedAt=Date.now(); saveDb();
}

document.addEventListener('input', e=>{
  if(e.target.id==='findInput') doFindRun(e.target.value);
});
document.addEventListener('click', e=>{
  if(e.target.id==='findNext'){ nextFind(1); }
  else if(e.target.id==='findPrev'){ nextFind(-1); }
  else if(e.target.id==='replaceOne'){ replaceOneFind(); }
  else if(e.target.id==='replaceAll'){ replaceAllFind(); }
});

function startDictationInline(ce){
  const sr=getSR(); if(!sr){ toast(t('toast.voiceErr')); return; }
  sr.lang = state.cfg.lang==='en' ? 'en-US' : 'pl-PL';
  sr.continuous=false; sr.interimResults=false;
  toast(t('toast.voiceStart'));
  sr.onresult=e=>{ const tx=e.results[0][0].transcript; ce.focus(); try{ document.execCommand('insertText', false, tx+' '); }catch(e){} };
  sr.onerror=()=>toast(t('toast.voiceErr'));
  sr.onend=()=>toast(t('toast.voiceEnd'));

}

/* ═══ DRAWING ═══ */
function openDraw(blockId, existing){
  state.drawTargetBlockId=blockId;
  state.drawExistingData=existing||null;
  const modal=document.getElementById('drawModal');
  modal.classList.add('active');
  const canvas=document.getElementById('drawCanvas');
  const wrap=canvas.parentElement;
  const w=wrap.clientWidth, h=wrap.clientHeight;
  const dpr=window.devicePixelRatio||1;
  canvas.width=w*dpr; canvas.height=h*dpr;
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.fillStyle='white'; ctx.fillRect(0,0,w,h);
  ctx.lineCap='round'; ctx.lineJoin='round';
  state.drawStrokes=[];
  if(existing){
    const img=new Image();
    img.onload=()=>ctx.drawImage(img,0,0,w,h);
    img.src=existing;
  }
  let drawing=false, last=null, cur=null;
  const pt=(e)=>{ const r=canvas.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return {x:p.clientX-r.left, y:p.clientY-r.top}; };
  const onStart=e=>{ e.preventDefault(); drawing=true; last=pt(e); cur={color:state.drawCurrent,pts:[last]}; };
  const onMove=e=>{
    if(!drawing) return; e.preventDefault();
    const p=pt(e);
    ctx.strokeStyle=state.drawCurrent; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    cur.pts.push(p); last=p;
  };
  const onEnd=()=>{ if(drawing && cur) state.drawStrokes.push(cur); drawing=false; };
  canvas.addEventListener('touchstart', onStart, {passive:false});
  canvas.addEventListener('touchmove', onMove, {passive:false});
  canvas.addEventListener('touchend', onEnd);
  canvas.addEventListener('mousedown', onStart);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onEnd);
  canvas.addEventListener('mouseleave', onEnd);
  canvas._cleanup=()=>{
    canvas.removeEventListener('touchstart', onStart);
    canvas.removeEventListener('touchmove', onMove);
    canvas.removeEventListener('touchend', onEnd);
    canvas.removeEventListener('mousedown', onStart);
    canvas.removeEventListener('mousemove', onMove);
    canvas.removeEventListener('mouseup', onEnd);
    canvas.removeEventListener('mouseleave', onEnd);
  };
  document.querySelectorAll('.draw-color').forEach(c=>{
    c.onclick=()=>{ state.drawCurrent=c.dataset.color; document.querySelectorAll('.draw-color').forEach(x=>x.classList.toggle('active',x===c)); };
  });
  document.getElementById('drawUndo').onclick=()=>{
    state.drawStrokes.pop();
    ctx.fillStyle='white'; ctx.fillRect(0,0,w,h);
    if(state.drawExistingData){
      const img=new Image();
      img.onload=()=>{
        ctx.drawImage(img,0,0,w,h);
        state.drawStrokes.forEach(s=>{
          ctx.strokeStyle=s.color; ctx.lineWidth=2.5;
          for(let i=1;i<s.pts.length;i++){ ctx.beginPath(); ctx.moveTo(s.pts[i-1].x,s.pts[i-1].y); ctx.lineTo(s.pts[i].x,s.pts[i].y); ctx.stroke(); }
        });
      };
      img.src=state.drawExistingData;
    } else {
      state.drawStrokes.forEach(s=>{
        ctx.strokeStyle=s.color; ctx.lineWidth=2.5;
        for(let i=1;i<s.pts.length;i++){ ctx.beginPath(); ctx.moveTo(s.pts[i-1].x,s.pts[i-1].y); ctx.lineTo(s.pts[i].x,s.pts[i].y); ctx.stroke(); }
      });
    }
  };
  document.getElementById('drawClear').onclick=()=>{
    if(confirm('Clear?')){ state.drawStrokes=[]; state.drawExistingData=null; ctx.fillStyle='white'; ctx.fillRect(0,0,w,h); }
  };
}
function saveDrawing(){
  const canvas=document.getElementById('drawCanvas');
  const note=getNote();
  const b=note?.blocks?.find(x=>x.id===state.drawTargetBlockId);
  if(b){ b.content=canvas.toDataURL('image/png'); note.updatedAt=Date.now(); saveDb(); }
  closeDraw(); renderEditor();
}
function closeDraw(){
  document.getElementById('drawModal').classList.remove('active');
  const canvas=document.getElementById('drawCanvas');
  if(canvas._cleanup) canvas._cleanup();
}

/* ═══ SEARCH ═══ */
function doSearch(query){
  const c=document.getElementById('searchResults');
  c.innerHTML='';
  const q=(query||'').trim().toLowerCase();
  if(!q){ c.innerHTML=`<div class="empty-state"><div class="icon">🔍</div><h3>${esc(t('search.title'))}</h3><p>${esc(t('search.empty'))}</p></div>`; return; }
  const results=[];
  state.db.projects.forEach(p=>{
    if(p.name.toLowerCase().includes(q)) results.push({kind:'project',pid:p.id,title:p.name,path:'·',preview:p.desc||''});
    p.sections.forEach(s=>{
      if(s.name.toLowerCase().includes(q)) results.push({kind:'section',pid:p.id,title:s.name,path:p.name,preview:''});
    });
    p.notes.forEach(n=>{
      const title=(n.title||'').toLowerCase();
      const all=n.blocks.map(b=>plainText(b.content||'').toLowerCase()).join(' ');
      if(title.includes(q)||all.includes(q)){
        const sec=p.sections.find(s=>s.id===n.sectionId);
        const preview = all.length>160 ? all.slice(Math.max(0, all.indexOf(q)-40), all.indexOf(q)+120) : all;
        results.push({kind:'note',pid:p.id,nid:n.id,title:n.title||t('note.untitled'),path:p.name+(sec?' › '+sec.name:''),preview});
      }
    });
  });
  state.db.inbox.forEach(n=>{
    const title=(n.title||'').toLowerCase();
    const all=n.blocks.map(b=>plainText(b.content||'').toLowerCase()).join(' ');
    if(title.includes(q)||all.includes(q)) results.push({kind:'inbox',nid:n.id,title:n.title||t('note.untitled'),path:'📥 '+t('nav.inbox'),preview:all.slice(0,160)});
  });
  state.db.archive.forEach(n=>{
    const title=(n.title||'').toLowerCase();
    const all=n.blocks.map(b=>plainText(b.content||'').toLowerCase()).join(' ');
    if(title.includes(q)||all.includes(q)) results.push({kind:'archive',nid:n.id,title:n.title||t('note.untitled'),path:'📦 '+t('inbox.archive'),preview:all.slice(0,160)});
  });
  if(results.length===0){ c.innerHTML=`<div class="empty-state"><div class="icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><h3>${esc(t('search.noResults'))}</h3></div>`; return; }
  results.forEach(r=>{
    const card=document.createElement('div'); card.className='search-result';
    const hl=s=>esc(s).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`);
    card.innerHTML=`<div class="search-result-path">${esc(r.path)}</div><div class="search-result-title">${hl(r.title)}</div>${r.preview?`<div class="search-result-preview">${hl(r.preview)}</div>`:''}`;
    card.onclick=()=>{
      if(r.kind==='project'){ switchTab('home'); state.nav.projectId=r.pid; state.nav.view='project'; renderCurrentView(); }
      else if(r.kind==='section'){ switchTab('home'); state.nav.projectId=r.pid; state.nav.view='project'; renderCurrentView(); }
      else if(r.kind==='note'){ switchTab('home'); state.nav.projectId=r.pid; openNote(r.nid, null); }
      else if(r.kind==='inbox'){ switchTab('inbox'); state.nav.inboxTab='inbox'; openNote(r.nid,'inbox'); }
      else if(r.kind==='archive'){ switchTab('inbox'); state.nav.inboxTab='archive'; openNote(r.nid,'archive'); }
    };
    c.appendChild(card);
  });
}

/* ═══ SETTINGS ═══ */
function renderSettings(){
  const c=document.getElementById('settingsContent');
  const themeObj=[...THEMES.light,...THEMES.dark].find(th=>th.id===state.cfg.theme);
  const themeLabel=themeObj?themeObj.label[state.cfg.lang]:'';
  const mode = state.cfg.themeMode==='dark' ? (state.cfg.lang==='pl'?'Ciemny':'Dark') : (state.cfg.lang==='pl'?'Jasny':'Light');
  const lang = state.cfg.lang==='pl' ? 'Polski' : 'English';
  const tp=state.db.projects.length;
  const ts=state.db.projects.reduce((s,p)=>s+p.sections.length,0);
  const tn = state.db.projects.reduce((s,p)=>s+p.notes.length,0) + state.db.inbox.length + state.db.archive.length;

/* ═══ Export note as PNG (Canvas-based) ═══ */
async function exportNoteAsPng(note){
  closeSheet();
  if(!note){ note = getNote(); }
  if(!note) return;
  toast(state.cfg.lang==='pl'?'Generuję obraz...':'Generating image...');
  // Build a styled HTML representation, then rasterize via SVG foreignObject
  const W = 720, padding = 36;
  const cs = getComputedStyle(document.body);
  const bg = cs.getPropertyValue('--bg').trim() || '#f7f6f2';
  const surface = cs.getPropertyValue('--surface').trim() || '#fff';
  const text = cs.getPropertyValue('--text').trim() || '#1a1916';
  const text2 = cs.getPropertyValue('--text2').trim() || '#5c5a52';
  const accent = cs.getPropertyValue('--accent').trim() || '#2c5f4a';
  const border = cs.getPropertyValue('--border').trim() || '#e0ddd4';
  const display = cs.getPropertyValue('--display').trim() || 'Georgia, serif';
  const body = cs.getPropertyValue('--body').trim() || 'system-ui, sans-serif';
  const title = (note.title||'').trim() || t('note.untitled');
  const blocksHtml = (note.blocks||[]).map(b=>{
    const c = b.content||'';
    if(b.kind==='heading') return `<h2 style="font-family:${display};font-weight:600;font-size:22px;margin:18px 0 6px">${esc(plainText(c))||'&nbsp;'}</h2>`;
    if(b.kind==='quote') return `<blockquote style="border-left:3px solid ${accent};padding:6px 14px;color:${text2};margin:10px 0;font-style:italic">${c||'&nbsp;'}</blockquote>`;
    if(b.kind==='callout') return `<div style="background:${accent}20;border-left:3px solid ${accent};padding:10px 14px;border-radius:6px;margin:10px 0">${c||'&nbsp;'}</div>`;
    if(b.kind==='code') { const parsed=parseCodeContent(c); return `<pre style="background:#1a1a1a;color:#eaeaea;padding:14px;border-radius:8px;overflow:hidden;font-family:monospace;font-size:13px;margin:10px 0;white-space:pre-wrap">${esc(parsed.code)}</pre>`; }
    if(b.kind==='check'){
      const lines=plainText(c).split('\n').map(l=>{ const done=/^\[x\]/i.test(l.trim()); const tx=l.replace(/^\[[x ]\]\s*/i,''); return `<div style="margin:4px 0">${done?'☑':'☐'} ${esc(tx)}</div>`; }).join('');
      return `<div style="margin:10px 0">${lines}</div>`;
    }
    if(b.kind==='markdown') return `<div style="margin:10px 0;font-size:14px">${mdToHtml(c)}</div>`;
    if(b.kind==='image' && c) return `<img src="${c}" style="max-width:100%;border-radius:8px;margin:10px 0">`;
    if(b.kind==='drawing' && c) return `<img src="${c}" style="max-width:100%;border-radius:8px;margin:10px 0">`;
    if(b.kind==='audio') return `<div style="background:${border};padding:10px;border-radius:8px;font-size:13px;color:${text2};margin:10px 0">🎤 audio</div>`;
    return `<div style="margin:10px 0;line-height:1.6">${c||'&nbsp;'}</div>`;
  }).join('');
  const html = `
    <div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:${W}px;background:${bg};color:${text};font-family:${body};padding:${padding}px;font-size:15px;line-height:1.6">
      <h1 style="font-family:${display};font-weight:600;font-size:30px;margin:0 0 18px;color:${text}">${esc(title)}</h1>
      <div>${blocksHtml}</div>
      <div style="margin-top:24px;padding-top:14px;border-top:1px solid ${border};color:${text2};font-size:11px;letter-spacing:0.06em">YEStess · ${new Date().toLocaleDateString()}</div>
    </div>
  `;
  // Measure height
  const meas = document.createElement('div');
  meas.innerHTML = html; meas.style.position='absolute'; meas.style.left='-9999px'; meas.style.top='0';
  document.body.appendChild(meas);
  const inner = meas.firstElementChild;
  const H = Math.max(400, inner.offsetHeight + 20);
  meas.remove();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject width="100%" height="100%">${html}</foreignObject></svg>`;
  const blob = new Blob([svg], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = ()=>{
    const cv = document.createElement('canvas');
    cv.width=W*2; cv.height=H*2; // 2x retina
    const ctx = cv.getContext('2d');
    ctx.scale(2,2);
    ctx.drawImage(img, 0, 0);
    cv.toBlob(b=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download=`yestess-${(title||'note').replace(/[^a-z0-9]/gi,'_').toLowerCase()}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(a.href);
      toast(t('toast.pngReady'));
    }, 'image/png');
    URL.revokeObjectURL(url);
  };
  img.onerror = ()=>{ URL.revokeObjectURL(url); toast(state.cfg.lang==='pl'?'Błąd generowania':'Error'); };
  img.src = url;
}

function importFromFile(mergeMode){
  const inp=document.getElementById('fileInput'); inp.value='';
  inp.onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const data=JSON.parse(r.result);
        if(data.app!=='YEStess') throw new Error('bad');
        if(data.kind==='project' && data.project){
          if(!state.db) state.db={folders:[],projects:[],inbox:[],archive:[]};
          const clone=JSON.parse(JSON.stringify(data.project));
          clone.id=uid('p');
          // handle v2 exports
          if(!clone.sections && clone.chapters){
            clone.sections=[]; clone.notes=[];
            (clone.chapters||[]).forEach((ch,i)=>{
              const sid=uid('s');
              clone.sections.push({id:sid,name:ch.title||'Section',order:i});
              (ch.notes||[]).forEach(n=>{ n.sectionId=sid; n.openCount=1; n.lastOpenedAt=n.updatedAt||Date.now(); clone.notes.push(n); });
            });
            delete clone.chapters;
            clone.sectionLabel = clone.chapterLabel || t('label.chapters');
            delete clone.chapterLabel;
          }
          const idMap={};
          clone.sections.forEach(s=>{ const ni=uid('s'); idMap[s.id]=ni; s.id=ni; });
          clone.notes.forEach(n=>{
            n.id=uid('n');
            if(n.sectionId && idMap[n.sectionId]) n.sectionId=idMap[n.sectionId];
            n.blocks.forEach(b=>b.id=uid('b'));
          });
          if(clone.customBlockKinds) clone.customBlockKinds.forEach(k=>k.id=uid('ck'));
          state.db.projects.push(clone);
          saveDb();
          toast(t('toast.imported'));
          renderCurrentView();
        } else {
          if(!data.db || !data.cfg) throw new Error('bad');
          if(mergeMode){
            // Merge: keep existing data, append imported items with new ids
            if(!state.db) state.db={folders:[],projects:[],inbox:[],archive:[]};
            const idMap={fid:{}, pid:{}};
            (data.db.folders||[]).forEach(f=>{
              const newF={...f, id:uid('f')};
              idMap.fid[f.id]=newF.id;
              state.db.folders.push(newF);
            });
            (data.db.projects||[]).forEach(p=>{
              const clone=JSON.parse(JSON.stringify(p));
              const oldPid=clone.id;
              clone.id=uid('p');
              idMap.pid[oldPid]=clone.id;
              if(clone.folderId && idMap.fid[clone.folderId]) clone.folderId=idMap.fid[clone.folderId];
              if(!clone.sections && clone.chapters){
                clone.sections=[]; clone.notes=[];
                (clone.chapters||[]).forEach((ch,i)=>{
                  const sid=uid('s');
                  clone.sections.push({id:sid,name:ch.title||'Section',order:i});
                  (ch.notes||[]).forEach(n=>{ n.sectionId=sid; clone.notes.push(n); });
                });
                delete clone.chapters;
                clone.sectionLabel=clone.chapterLabel||t('label.chapters');
                delete clone.chapterLabel;
              }
              const sm={};
              (clone.sections||[]).forEach(s=>{ const ni=uid('s'); sm[s.id]=ni; s.id=ni; });
              (clone.notes||[]).forEach(n=>{
                n.id=uid('n');
                if(n.sectionId && sm[n.sectionId]) n.sectionId=sm[n.sectionId];
                (n.blocks||[]).forEach(b=>b.id=uid('b'));
              });
              if(clone.customBlockKinds) clone.customBlockKinds.forEach(k=>k.id=uid('ck'));
              state.db.projects.push(clone);
            });
            (data.db.inbox||[]).forEach(n=>{
              const c=JSON.parse(JSON.stringify(n)); c.id=uid('n');
              (c.blocks||[]).forEach(b=>b.id=uid('b'));
              state.db.inbox.unshift(c);
            });
            (data.db.archive||[]).forEach(n=>{
              const c=JSON.parse(JSON.stringify(n)); c.id=uid('n');
              (c.blocks||[]).forEach(b=>b.id=uid('b'));
              state.db.archive.unshift(c);
            });
            upgradeDbToV4();
            saveDb();
            renderCurrentView();
            toast(t('toast.merged'));
            return;
          }
          if(!confirm(t('confirm.import'))) return;
          state.cfg=data.cfg; state.db=data.db;
          if(!state.db.inbox) state.db.inbox=[];
          if(!state.db.archive) state.db.archive=[];
          // migrate v2 data if needed
          state.db.projects.forEach(p=>{
            if(!p.sections && p.chapters){
              p.sections=[]; p.notes=[];
              p.chapters.forEach((ch,i)=>{
                const sid=uid('s');
                p.sections.push({id:sid,name:ch.title||'Section',order:i});
                (ch.notes||[]).forEach(n=>{ n.sectionId=sid; n.openCount=1; n.lastOpenedAt=n.updatedAt||Date.now(); p.notes.push(n); });
              });
              delete p.chapters;
              p.sectionLabel=p.chapterLabel||t('label.chapters');
              delete p.chapterLabel;
            }
            if(!p.customBlockKinds) p.customBlockKinds=[];
          });
          saveCfg(); saveDb();
          if(document.getElementById('onboarding').classList.contains('active') || document.getElementById('langPicker').classList.contains('active')){
            document.getElementById('onboarding').classList.remove('active');
            document.getElementById('langPicker').classList.remove('active');
            enterApp();
          } else { applyTheme(); applyI18n(); renderCurrentView(); }
          toast(t('toast.imported'));
        }
      } catch(err){ toast('Bad file'); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function resetEverything(){
  if(!confirm(t('confirm.reset'))) return;
  if(!confirm(t('confirm.reset2'))) return;
  localStorage.removeItem(LS_DB); localStorage.removeItem(LS_CFG);
  localStorage.removeItem(LS_OLD_DB); localStorage.removeItem(LS_OLD_CFG);
  location.reload();
}

/* ═══ SHEET / TOAST ═══ */
function openSheet(title, bodyHtml){
  document.getElementById('sheetTitle').textContent = title||'';
  document.getElementById('sheetBody').innerHTML = bodyHtml;
  document.getElementById('sheetBackdrop').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheetBackdrop').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}

/* ═══ Help / Function explainer ═══ */
function openHelp(topic){
  const m=document.getElementById('helpModal');
  document.getElementById('helpTitle').textContent = t('help.title');
  document.getElementById('helpBody').innerHTML = helpContent(topic);
  m.classList.add('open');
}
function closeHelp(){ document.getElementById('helpModal').classList.remove('open'); }

function helpContent(topic){
  const all = `
    <h4>📐 Struktura</h4>
    <p><strong>Foldery</strong> grupują projekty. <strong>Projekty</strong> mają własne <strong>działy</strong> (rozdziały, akty, części — sam wybierasz). W działach żyją <strong>notatki</strong>, a notatki składają się z <strong>bloków</strong>.</p>

    <h4>📥 Inbox & Archiwum</h4>
    <p>Szybkie myśli wrzucasz do <strong>Inboxu</strong> (FAB +). Z Inboxu przenosisz do projektu albo zostawiasz. <strong>Archiwum</strong> = notatki które „odłożyłeś". Pin działa wszędzie.</p>

    <h4>🧩 Bloki</h4>
    <p>Każdy blok ma swój typ: tekst, nagłówek, cytat, zadania (todo), wyróżnienie, kod, markdown, obraz, audio, rysunek, dyktowanie. Możesz tworzyć własne typy z kolorem (per projekt).</p>

    <h4>▶ Kod</h4>
    <p>Bloki kodu z językiem HTML / JS / CSS uruchamiają się w sandboxowanej ramce iframe. C++/Python/Java są tylko podświetlane (przeglądarka ich nie wykona).</p>

    <h4>📝 Markdown</h4>
    <p>Pisz w markdown, przełącz na podgląd. Wspierane: <code># nagłówek</code>, <code>**pogrubienie**</code>, <code>*kursywa*</code>, <code>\`kod\`</code>, listy, cytaty <code>&gt;</code>, linki <code>[tekst](url)</code>, <code>\`\`\`kod\`\`\`</code>, <code>---</code>.</p>

    <h4>🎙 Dyktowanie</h4>
    <p>Pasek formatowania ma ikonę mikrofonu — dyktuje do bieżącego bloku. Osobny <strong>blok dyktowania</strong> nagrywa ciągle, dopisuje końcowe wyniki.</p>

    <h4>🔍 Znajdź / zamień</h4>
    <p>W edytorze: pasek formatowania → ikona lupy. Lub menu (3 kropki) → „Znajdź / zamień". Strzałki ↑↓ skaczą po wynikach. „Wszystko" zastępuje wszystkie naraz.</p>

    <h4>✋ Przeciąganie</h4>
    <p>Wszędzie gdzie widzisz kropki ⋮⋮ — chwyć i przeciągnij. Kolejność bloków, notatek, projektów, działów, folderów.</p>

    <h4>🔄 Echo</h4>
    <p>Apka czasem podsuwa starszą notatkę do ponownego rozważenia. Reguły dostosowujesz: dni od ostatniego otwarcia, minimalne słowa, minimalne otwarcia. Możesz mieć wiele reguł.</p>

    <h4>🔒 Ukryty notatnik</h4>
    <p>Przytrzymaj logo YEStess w nagłówku przez 3 sekundy — pojawi się prompt na hasło. Dane szyfrowane AES-GCM (PBKDF2 100k iteracji). Hasło nie jest nigdzie zapisywane — strata = utrata danych.</p>

    <h4>🎨 Motywy & czcionki</h4>
    <p>16 motywów (8 jasnych + 8 ciemnych). Wybierasz w Ustawieniach. Czcionki: 4 zestawy (klasyczny, nowoczesny, techniczny, elegancki).</p>

    <h4>💾 Backup</h4>
    <p>Dane siedzą w localStorage przeglądarki. Bez eksportu znikną przy czyszczeniu! Eksport = JSON. Import = scal z istniejącymi LUB zastąp.</p>

    <h4>📲 Instalacja PWA</h4>
    <p>Ustawienia → „Zainstaluj na urządzeniu". Na Androidzie: prompt instalacyjny. Na iOS: menu Safari → „Dodaj do ekranu głównego".</p>

    <h4>📸 Eksport jako obraz</h4>
    <p>Z menu notatki: „Zapisz jako obraz" — zrzut PNG całej notatki, gotowy do udostępnienia.</p>

    <h4>📊 Statystyki</h4>
    <p>Każda notatka i projekt mają własne statystyki: słowa, znaki, bloki, otwarcia, czas tej sesji, łączny czas pracy.</p>

    <h4>⌨️ Skróty klawiaturowe</h4>
    <p><kbd>Esc</kbd> — zamknij sheet / draw modal / find. <kbd>Enter</kbd> w bloku check — nowa pozycja. <kbd>Backspace</kbd> na pustej pozycji — usuń.</p>
  `;
  return all;
}
// action list handlers via delegation
document.addEventListener('click',(e)=>{
  const row=e.target.closest('.sheet-body .action-row');
  if(!row) return;
  const idx=row.dataset.i;
  if(idx===undefined) return;
  const h=sheetHandlers[Number(idx)];
  if(h) h();
});

let toastTimer;
function toast(msg){
  const tEl=document.getElementById('toast');
  tEl.textContent=msg;
  tEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>tEl.classList.remove('show'), 2200);
}

/* ═══ GLOBAL LISTENERS ═══ */
document.addEventListener('input', e=>{
  if(e.target.id==='obProjectName'||e.target.id==='obCustomLabel') validateStep();
  if(e.target.id==='searchInput') doSearch(e.target.value);
});
document.addEventListener('keydown', e=>{
  // close sheet on Escape
  if(e.key==='Escape'){
    if(document.getElementById('helpModal')?.classList.contains('open')){ closeHelp(); }
    else if(document.getElementById('findBar')?.classList.contains('open')){ closeFind(); }
    else if(document.getElementById('drawModal').classList.contains('active')){ closeDraw(); }
    else if(document.getElementById('sheet').classList.contains('open')){ closeSheet(); }
  }
});

(function start(){ init(); })();
</script>
